# 光束系占位武装。数值为相对强度设计，非任何官方数值转录。
schema_version: "1.0.0"
balance_patch: "2026.08.0"
library: beam

weapons:
  - id: weapon.beam_rifle_standard
    display_name_key: loc.weapon.beam_rifle_standard
    category: beam
    slot_types: [main]
    damage_class: medium
    range_class: mid
    magazine: 8
    total_ammo: 64
    reload_sec: 2.0
    tags: [chargeable, predictive]
    notes: "通用主兵装基准；チャージ射撃可瞬时装填。"
    asset_binding:
      model_id: placeholder.weapon.rifle
