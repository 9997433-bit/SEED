  # ---- 机体名 ----
  loc.unit.strike: 强袭
  loc.unit.strike.desc: 可在战斗中更换背包的通用试作机，空/剑/炮三形态覆盖全距离。全项目换装基准。
  loc.unit.dagger_l: 短剑 L
  loc.unit.dagger_l.desc: 量产型主力机，性能均衡、门槛低，用作教学与杂兵模板。
  loc.unit.calamity: 灾恶
  loc.unit.calamity.desc: 重装炮击机，高耐久低机动，以站桩输出换取火力密度。
  loc.unit.forbidden: 禁断
  loc.unit.forbidden.desc: 装备方向性偏转装甲的防御特化机，正面承伤能力突出。
  loc.unit.raider: 强夺
  loc.unit.raider.desc: 可变形为高速 MA 的重量级机体，近战抓取与突袭并重。
  loc.unit.aegis: 圣盾
  loc.unit.aegis.desc: 早期可变形试作机，MA 形态换取机动与大出力主炮。
  loc.unit.guaiz: 盖茨
  loc.unit.guaiz.desc: 二代量产主力机，全项目相对强度基准（power_budget 1000）。
  loc.unit.ginn: 金恩
  loc.unit.ginn.desc: 初代量产机，作为杂兵与相对强度下限锚点。
  loc.unit.zaku_warrior: 扎古勇士
  loc.unit.zaku_warrior.desc: 可更换背包的量产机，战士型主打火力，幻影型主打隐蔽突袭。
  loc.unit.impulse: 脉冲
  loc.unit.impulse.desc: 三形态换装试作机，核心分离机制在 M0 简化为形态切换演出。
  loc.unit.chaos: 混沌
  loc.unit.chaos.desc: 搭载远隔操作兵装的可变形机，MA 形态制空能力强。
  loc.unit.freedom: 自由
  loc.unit.freedom.desc: 多目标齐射与觉醒模式叠加的高性能机，验证多重锁定管线。
  loc.unit.justice: 正义
  loc.unit.justice.desc: 可与大型合体装备结合的高性能机，合体后转为火力平台。
  loc.unit.destiny: 命运
  loc.unit.destiny.desc: 高机动 Boss 级机体，具备残像与光翼类表现（表现为原创实现）。
  loc.unit.infinite_justice: 无限正义
  loc.unit.infinite_justice.desc: 综合性能机，可分离飞行装备独立作战；首发后期解锁目标。
  loc.unit.strike_rouge: 强袭嫣红
  loc.unit.strike_rouge.desc: 精简换装机，共用 Striker 型背包槽，仅保留空装与剑装。
  loc.unit.m1_astray: M1 异端
  loc.unit.m1_astray.desc: 奥布量产机，偏防御与团队支援定位。
  loc.unit.astray_red_frame: 红色异端
  loc.unit.astray_red_frame.desc: 近战特化试作机，长刀二刀流验证长连段与硬直抗性。

