# 顶层数据清单 —— 所有 ref 相对本文件所在的 data/ 目录。
# 校验：python3 tools/data_validator/validate.py
schema_version: "1.0.0"
balance_patch: "2026.08.0"
milestone: M0
notes: >-
  M0 首发 18 台底盘（docs/03-units-and-data.md 3.6 节 1-18）。
  全部数值为本项目自建的相对强度设计，以 power_budget = 1000 的标准机动 MS 为基准；
  全部 asset_binding.placeholder 为 true，运行时使用原创方块占位几何体。

factions:
  - id: faction.omni
    name_key: loc.faction.omni
  - id: faction.zaft
    name_key: loc.faction.zaft
  - id: faction.orb
    name_key: loc.faction.orb
  - id: faction.three_ships
    name_key: loc.faction.three_ships
  - id: faction.mercenary
    name_key: loc.faction.mercenary

libraries:
  weapons:
    - weapons/beam.yaml
    - weapons/ballistic.yaml
    - weapons/melee.yaml
    - weapons/special.yaml
  abilities:
    - abilities/core.yaml
  overlays:
    - overlays/core.yaml
  pilots:
    - pilots/core.yaml
  locales:
    - locales/zh_cn.yaml

