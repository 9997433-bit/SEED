schema_version: "1.0.0"
parent_chassis: chassis.gat_x303

forms:
  - id: form.gat_x303.ms
    display_name_key: loc.form.aegis_ms
    type: base_form
    weapons:
      - slot: main
        weapon_id: weapon.beam_rifle_standard
      - slot: melee
        weapon_id: weapon.beam_saber_standard
      - slot: sub
        weapon_id: weapon.head_vulcan
      - slot: shield
        weapon_id: weapon.shield_beam_projector
    abilities: [ability.sp.beam_barrage]
    transform_graph:
      - to: form.gat_x303.ma
        trigger: manual
        duration_sec: 2.5
        one_way: false
        constraints:
          forbid_states: [grappled, downed]
    mode_overlays:
      - overlay_id: overlay.phase_shift_armor
    asset_binding:
      model_id: placeholder.mech.block_medium
      placeholder: true

  - id: form.gat_x303.ma
    display_name_key: loc.form.aegis_ma
    type: transform_form
    size_class_override: large
    stat_modifiers:
      mobility: 0.15
      defense: 0.10
    weapons:
      - slot: main
        weapon_id: weapon.ma_main_cannon
      - slot: sub
        weapon_id: weapon.beam_scatter_gun
      - slot: melee
        weapon_id: weapon.grapple_claw
    abilities: [ability.sp.ma_strafe_run]
    transform_graph:
      - to: form.gat_x303.ms
        trigger: manual
        duration_sec: 2.5
        one_way: false
        constraints:
          forbid_states: [grappled, downed]
    mode_overlays:
      - overlay_id: overlay.phase_shift_armor
    asset_binding:
      model_id: placeholder.mech.block_ma
      placeholder: true
